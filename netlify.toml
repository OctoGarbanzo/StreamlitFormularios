[build]
  command = "pip install -r requirements.txt && streamlit run app.py"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.11"
  STREAMLIT_SERVER_PORT = "8501"
  STREAMLIT_SERVER_ADDRESS = "0.0.0.0"
  STREAMLIT_SERVER_HEADLESS = "true"
  STREAMLIT_SERVER_ENABLE_CORS = "false"

[[redirects]]
  from = "/*"
  to = "/"
  status = 200